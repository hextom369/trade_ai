[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-ai"
version = "0.1.0"
description = "Machine-learning trading signal research framework with walk-forward validation and realistic backtesting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[project.scripts]
trade-ai = "trade_ai.cli:main"

[tool.setuptools.packages.find]
include = ["trade_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
